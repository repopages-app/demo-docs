# Fails a pull request that changes src/ without touching docs/, unless it carries the
# no-docs-needed label. Deterministic companion to the agent review in docs-review.yml.
name: Docs guard
on: pull_request
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail when code changed and docs did not
        if: "!contains(github.event.pull_request.labels.*.name, 'no-docs-needed')"
        run: |
          base=${{ github.event.pull_request.base.sha }}
          code=$(git diff --name-only "$base"...HEAD -- src/ | wc -l)
          docs=$(git diff --name-only "$base"...HEAD -- docs/ | wc -l)
          if [ "$code" -gt 0 ] && [ "$docs" -eq 0 ]; then
            echo "::error::src/ changed in $code file(s) but docs/ did not. Update the docs or add the no-docs-needed label."
            exit 1
          fi
