# Asks an agent whether this pull request made any page in docs/ stale. Advice only:
# the output is a PR comment, the agent edits nothing. Needs the ANTHROPIC_API_KEY secret.
name: Docs review
on:
  pull_request:
    paths: ['src/**', 'docs/**']
jobs:
  review:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read AGENTS.md. Compare the diff of this pull request against the docs
            pages mapped to the changed code areas. Reply with one comment:
            either "Docs are consistent" with one sentence why, or a list of
            pages and the exact statements or diagram steps that are now wrong.
            Do not edit files.
