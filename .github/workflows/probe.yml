name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      S: ${{ secrets.REPOPAGES_SECRET }}
      U: ${{ secrets.REPOPAGES_URL }}
    steps:
      - run: |
          echo "secret length=${#S}"
          if [[ "$S" =~ ^[0-9a-f]{64}$ ]]; then echo "secret shape=64 hex, clean"; else echo "secret shape=NOT 64 clean hex"; fi
          case "$S" in *$'\n'*) echo "secret has newline=yes";; *) echo "secret has newline=no";; esac
          echo "url length=${#U}"
          case "$U" in https://*) echo "url starts https=yes";; *) echo "url starts https=no";; esac
          case "$U" in *$'\n'*|*' '*) echo "url has whitespace=yes";; *) echo "url has whitespace=no";; esac
